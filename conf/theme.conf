set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█ "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"

set -g @claude_segment "#{?#{==:#{@claude_state},waiting},#[fg=#{@thm_bg}]#[bg=#{@thm_red}] ● claude #[default] ,#{?#{==:#{@claude_state},working},#[fg=#{@thm_bg}]#[bg=#{@thm_yellow}] ◐ claude #[default] ,#{?#{==:#{@claude_state},idle},#[fg=#{@thm_fg}]#[bg=#{@thm_surface_1}] ○ claude #[default] ,}}}"
set -g status-right-length 100
set -g status-left "#[range=user|sidebar]#[fg=#{@thm_bg}]#[bg=#{@thm_blue}] ☰ #[norange default] "
set -g @catppuccin_battery_icon "#(~/.config/tmux/scripts/battery.sh icon) "
set -g @catppuccin_battery_text " #(~/.config/tmux/scripts/battery.sh)"
set -g status-right "#{E:@claude_segment}#{E:@catppuccin_status_date_time}#{E:@catppuccin_status_battery}"
