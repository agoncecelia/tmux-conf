set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "catppuccin/tmux#v2.3.1"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @continuum-restore "on"
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-processes '"~sidebar.sh render->exec ~/.config/tmux/scripts/sidebar.sh render" "claude->claude --continue"'

set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"

set -g @claude_segment "#{?#{==:#{@claude_state},waiting},#[fg=#{@thm_bg}]#[bg=#{@thm_red}] ● claude #[default] ,#{?#{==:#{@claude_state},working},#[fg=#{@thm_bg}]#[bg=#{@thm_yellow}] ◐ claude #[default] ,#{?#{==:#{@claude_state},idle},#[fg=#{@thm_fg}]#[bg=#{@thm_surface_1}] ○ claude #[default] ,}}}"
set -g status-right-length 100
set -g status-left "#[range=user|sidebar]#[fg=#{@thm_bg}]#[bg=#{@thm_blue}] ☰ #[norange default] "
set -g status-right "#{E:@claude_segment}#{E:@catppuccin_status_date_time}"

if-shell "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run ~/.config/tmux/plugins/tpm/tpm
