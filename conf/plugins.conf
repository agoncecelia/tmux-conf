set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "catppuccin/tmux#v2.3.1"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @continuum-restore "on"
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-processes '"~sidebar.sh render->exec ~/.config/tmux/scripts/sidebar.sh render" "claude->claude --continue"'

if-shell "defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark" \
  "set -g @catppuccin_flavor mocha" \
  "set -g @catppuccin_flavor latte"
source-file ~/.config/tmux/conf/theme.conf
set-hook -g client-dark-theme "run-shell -b '~/.config/theme/theme apply'"
set-hook -g client-light-theme "run-shell -b '~/.config/theme/theme apply'"

if-shell "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run ~/.config/tmux/plugins/tpm/tpm
