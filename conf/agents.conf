bind C display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "claude"
bind D display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "git -c color.ui=always diff HEAD | less -R"

bind g if-shell -F "#{==:#{session_name},_scratch}" {
  detach-client
} {
  display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "tmux new-session -A -s _scratch"
}

set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

set-hook -g pane-focus-in[51] "run -b \"~/.config/tmux/scripts/agent-seen.sh '#{window_id}'\""
set-hook -g session-window-changed[51] "run -b \"~/.config/tmux/scripts/agent-seen.sh '#{window_id}'\""
set-hook -g client-session-changed[51] "run -b \"~/.config/tmux/scripts/agent-seen.sh '#{window_id}'\""
