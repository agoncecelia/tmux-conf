bind C display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "claude"
bind D if -b "git -C #{q:pane_current_path} rev-parse -q --verify HEAD" {
  display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "git -c color.ui=always diff HEAD | less -R"
} {
  display "Not a git repository (or no commits yet)"
}

bind g if-shell -F "#{==:#{session_name},_scratch}" {
  detach-client
} {
  display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "~/.config/tmux/scripts/scratch.sh"
}

set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

set -s command-alias[100] agent-seen='if -F "#{==:#{@claude_state},waiting}" "set -w @claude_state idle ; refresh-client -S" ; if -F "#{==:#{@codex_state},waiting}" "set -uw @codex_state ; refresh-client -S"'

set-hook -g pane-focus-in[51] agent-seen
set-hook -g session-window-changed[51] agent-seen
set-hook -g client-session-changed[51] agent-seen
