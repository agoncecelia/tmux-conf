if -F "#{==:#{@sidebar_enabled},}" "set -g @sidebar_enabled 1"
%hidden SIDEBAR_WIDTH=26
set -g @sidebar_width "$SIDEBAR_WIDTH"
set -g status-left-length 40

bind t run -b "~/.config/tmux/scripts/sidebar.sh toggle '#{window_id}'"
bind T run -b "~/.config/tmux/scripts/sidebar.sh focus '#{window_id}'"
bind a run -b "~/.config/tmux/scripts/sidebar.sh next-waiting '#{client_name}' '#{window_id}'"

set-hook -g client-attached[50] "run -b \"~/.config/tmux/scripts/sidebar.sh ensure-all\""
set-hook -g client-session-changed[50] "run -b \"~/.config/tmux/scripts/sidebar.sh ensure '#{window_id}'\""
set-hook -g session-window-changed[50] "run -b \"~/.config/tmux/scripts/sidebar.sh ensure '#{window_id}'\""
set-hook -g after-new-window[50] "run -b \"~/.config/tmux/scripts/sidebar.sh ensure '#{window_id}'\""
set-hook -g window-resized[50] {
  if -F "#{&&:#{==:#{@sidebar_enabled},1},#{&&:#{!=:#{window_zoomed_flag},1},#{P:#{?#{&&:#{@sidebar},#{==:#{pane_left},0}},1,}}}}" {
    resize-pane -t "{left}" -x "$SIDEBAR_WIDTH"
  }
}

bind -n MouseDown1Pane if -F -t = "#{@sidebar}" {
  run -b -t = "~/.config/tmux/scripts/sidebar.sh click '#{pane_id}' '#{mouse_y}' '#{client_name}'"
} {
  select-pane -t =
  send -M
  agent-seen
}

bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},sidebar}" {
  run -b "~/.config/tmux/scripts/sidebar.sh toggle '#{window_id}'"
} {
  switch-client -t =
}

run -b "~/.config/tmux/scripts/sidebar.sh ensure-all"
